regexes = [
  '''^CB4AYBA5NVQPVPNOWUCSZQK6ZIGOF7KSCS6SF6UV6D2OKPDXLHEPD4V7$''',
  '''^CCNW4YFXTU5J2MQALSFVI5LY2733AMX5ACBZCTFDN4BTZZJ743VPA2EU$''',
  '''^CAKR6ZPDHEXLDJ5TPIYWHO2IJYBXLNH7NU5TR2VTYUZMFX3KCX4JNUPX$''',
  '''^CCLF5XFG4HISGGJBRZTEB5AQ67TIRB4J3RJCU7Z4ADF3ACM7USR5GSGC$''',
]